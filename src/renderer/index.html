<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; img-src 'self' https://web.poecdn.com data:; font-src 'self' data:; style-src 'self'; script-src 'self'">
  <title>PoE 2 Price Checker</title>
  <link rel="stylesheet" href="fonts/fonts.css">
  <link rel="stylesheet" href="style.css">
</head>
<body data-tab="price">
  <header class="head">
  <div class="topbar">
    <div id="hdrop" class="hdrop">
      <button id="histBtn" title="Recent checks" data-i18n-title="Recent checks"><svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="6.3" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M8 4.2V8l2.6 1.6" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg></button>
      <div id="histMenu" class="lmenu hmenu" hidden></div>
    </div>
    <div id="ldrop" class="ldrop">
      <button id="leagueBtn" title="League" data-i18n-title="League"><span id="leagueName"></span><svg viewBox="0 0 12 8"><path d="M1 1.5l5 5 5-5" fill="none" stroke="currentColor" stroke-width="1.6"/></svg></button>
      <div id="leagueMenu" class="lmenu" hidden></div>
    </div>
    <button id="wideBtn" class="pinb wideb" title="Two columns"><svg viewBox="0 0 16 16"><rect x="1.5" y="2.5" width="13" height="11" rx="1" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M8 2.5v11" stroke="currentColor" stroke-width="1.3"/></svg></button>
    <button id="pinBtn" class="pinb" title="Pin the window: it stays open when you click the game" data-i18n-title="Pin the window: it stays open when you click the game"><svg viewBox="0 0 16 16"><path d="M10 1.5 14.5 6l-2 .5-2.5 2.5.5 3-1.5 1.5L6.5 11 2 15.5 1 15l4.5-4.5L3 7.5 4.5 6l3 .5L10 4z" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg></button>
    <span id="close" class="close" title="Close (Esc)" data-i18n-title="Close (Esc)">✕</span>
  </div>
  <div id="banner" class="banner">
    <div id="name" class="bn-name"></div>
    <div id="base" class="bn-base"></div>
  </div>
  </header>
  <main>
    <div id="status" hidden></div>
    <section id="tooltip" class="tt"></section>
    <nav id="tabs" class="tabs" hidden>
      <button data-tab="price" class="on"><span data-i18n="Price">Price</span></button>
      <button data-tab="demand"><span data-i18n="Demand">Demand</span><span id="demandBadge" class="badge"></span></button>
      <button data-tab="craft"><span data-i18n="Craft">Craft</span><span id="craftBadge" class="badge"></span><sup class="beta" data-i18n-title="Craft advice is in beta: modifier odds are estimates from samples we are still collecting, and unusual items can get a wrong plan. Check expensive steps yourself.">beta</sup></button>
    </nav>
    <div id="tab-craft" class="tab" hidden>
      <section id="craft" class="builds"></section>
    </div>
    <div id="tab-demand" class="tab" hidden>
      <section id="builds" class="builds" hidden></section>
      <section id="demand" class="builds" hidden></section>
    </div>
    <div id="tab-price" class="tab">
    <section id="hero" class="hero" hidden></section>
    <section id="filters" hidden>
      <div class="sect"><span data-i18n="Search filters">Search filters</span></div>
      <div id="mods"></div>
      <div id="misc" class="misc"></div>
      <button id="search">Search</button>
    </section>
    <div id="note" class="note" hidden></div>
    <section id="results" hidden></section>
    </div>
  </main>
  <footer>
    <span class="keys" data-i18n-title="Esc — close · Enter — search · click a listing — copy whisper"><kbd>Esc</kbd> <span data-i18n="key: close">close</span> <span class="k-enter"><kbd>Enter</kbd> <span data-i18n="key: search">search</span></span></span>
    <span class="foot-links">
      <button id="poe2db" class="link" hidden title="poe2db.tw">poe2db ↗</button>
      <button id="copyLink" class="link" hidden data-i18n="Copy link" data-i18n-title="Copy the trade search link">Copy link</button>
      <button id="open" class="link" hidden data-i18n="Trade site ↗">Trade site ↗</button>
    </span>
  </footer>
  <script src="../shared/i18n.js"></script>
  <script src="../shared/methods.js"></script>
  <script src="../shared/plancost.js"></script>
  <script src="core.js"></script>
  <script src="motion.js"></script>
  <script src="header.js"></script>
  <script src="price.js"></script>
  <script src="demand.js"></script>
  <script src="craft.js"></script>
  <script src="filters.js"></script>
  <script src="results.js"></script>
  <script src="events.js"></script>
</body>
</html>
