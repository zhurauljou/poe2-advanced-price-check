<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; img-src 'self' https://web.poecdn.com data:; font-src 'self' data:; style-src 'self'; script-src 'self'">
  <title>PoE 2 Price Checker</title>
  <link rel="stylesheet" href="fonts/fonts.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="topbar">
    <select id="league" title="League"></select>
    <span id="close" class="close" title="Close (Esc)">✕</span>
  </div>
  <div id="banner" class="banner">
    <div id="name" class="bn-name"></div>
    <div id="base" class="bn-base"></div>
  </div>
  <main>
    <div id="status" hidden></div>
    <section id="tooltip" class="tt"></section>
    <nav id="tabs" class="tabs" hidden>
      <button data-tab="price" class="on"><svg class="ticon" viewBox="0 0 16 16"><path d="M8 1v14M3 4h10M3 4l-2 5a2.5 2 0 0 0 4 0L3 4zm10 0-2 5a2.5 2 0 0 0 4 0l-2-5zM5 15h6" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg>Price</button>
      <button data-tab="demand"><svg class="ticon" viewBox="0 0 16 16"><path d="M1 15h14M3 15V9m4 6V5m4 10V7m4 8V2" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>Demand<span id="demandBadge" class="badge"></span></button>
    </nav>
    <div id="tab-demand" class="tab" hidden>
      <section id="builds" class="builds" hidden></section>
      <section id="demand" class="builds" hidden></section>
    </div>
    <div id="tab-price" class="tab">
    <section id="hero" class="hero" hidden></section>
    <section id="filters" hidden>
      <div class="sect"><span>Search filters</span></div>
      <div id="mods"></div>
      <div id="misc" class="misc"></div>
      <button id="search">Search</button>
    </section>
    <div id="note" class="note" hidden></div>
    <section id="results" hidden></section>
    </div>
  </main>
  <footer>
    <span>Esc — close · Enter — search · click a listing — copy whisper</span>
    <button id="open" class="link" hidden>Trade site ↗</button>
  </footer>
  <script src="app.js"></script>
</body>
</html>
