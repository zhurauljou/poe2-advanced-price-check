<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; img-src 'self' data:; font-src 'self' data:; style-src 'self'; script-src 'self'">
  <title>Updates — PoE 2 Price Checker</title>
  <link rel="stylesheet" href="fonts/fonts.css">
  <link rel="stylesheet" href="style.css">
</head>
<body class="upd-page">
  <div class="topbar">
    <span class="upd-title" data-i18n="Updates">Updates</span>
    <span id="close" class="close" title="Close" data-i18n-title="Close">✕</span>
  </div>
  <main class="upd">
    <div class="upd-ver"><span data-i18n="Installed:">Installed:</span> <b id="current"></b></div>
    <div id="state" class="upd-state"></div>
    <div id="bar" class="upd-bar" hidden><i></i></div>
    <div id="detail" class="upd-detail"></div>
    <div class="upd-actions">
      <button id="action" hidden></button>
      <button id="notes" class="link" hidden data-i18n="What's new ↗">What's new ↗</button>
    </div>
  </main>
  <script src="../shared/i18n.js"></script>
  <script src="updates.js"></script>
</body>
</html>
